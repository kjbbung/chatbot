<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일학습병행 전문 상담 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: #f5f5f7; color: #111827; }
    .container { display: flex; flex-direction: column; height: 100vh; max-width: 700px; margin: 0 auto; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
    header { padding: 16px; background: #2563eb; color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1d4ed8; }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg-wrap { display: flex; }
    .msg-wrap.user { justify-content: flex-end; }
    .msg-wrap.bot { justify-content: flex-start; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.875rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .bubble.user { background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
    .bubble.bot { background: #f3f4f6; color: #111827; border-bottom-left-radius: 2px; }
    .bubble.error { background: #fee2e2; color: #b91c1c; border-bottom-left-radius: 2px; }
    .bubble a { color: #2563eb; text-decoration: underline; word-break: break-all; }
    .bubble.user a { color: #bfdbfe; }
    #loading { padding: 4px 16px 8px; color: #9ca3af; font-size: 0.8rem; display: none; }
    .faq-area { padding: 8px 16px 4px; display: flex; flex-wrap: wrap; gap: 8px; }
    .faq-btn { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
    .faq-btn:hover { background: #dbeafe; }
    .faq-label { width: 100%; font-size: 0.75rem; color: #9ca3af; margin-bottom: 2px; }
    .input-area { padding: 12px 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; }
    #userInput { flex: 1; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 12px; font-size: 0.875rem; outline: none; min-width: 0; }
    #userInput:focus { border-color: #2563eb; }
    #sendBtn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 0.875rem; cursor: pointer; white-space: nowrap; }
    #sendBtn:hover { background: #1d4ed8; }
    #sendBtn:disabled { background: #93c5fd; cursor: not-allowed; }
    @media (max-width: 480px) {
      header h1 { font-size: 1rem; }
      .bubble { max-width: 90%; font-size: 0.813rem; }
      .input-area { padding: 8px 12px; }
      #sendBtn { padding: 8px 14px; font-size: 0.813rem; }
      .faq-btn { font-size: 0.75rem; padding: 5px 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>일학습병행 전문 상담 챗봇</h1>
      <img src="열공학습.jpg" alt="로고" onerror="this.style.display='none'">
    </header>
    <div id="chat"></div>
    <div id="loading">답변을 생성 중입니다...</div>
    <div class="faq-area" id="faqArea">
      <span class="faq-label">자주 묻는 질문</span>
      <button class="faq-btn" onclick="askFaq(this)">기업 혜택(지원)이 뭔가요?</button>
      <button class="faq-btn" onclick="askFaq(this)">훈련 비용은 얼마인가요?</button>
      <button class="faq-btn" onclick="askFaq(this)">일학습병행이 뭔가요?</button>
      <button class="faq-btn" onclick="askFaq(this)">신청 자격이 어떻게 되나요?</button>
      <button class="faq-btn" onclick="askFaq(this)">훈련생(학습근로자) 혜택은?</button>
      <button class="faq-btn" onclick="askFaq(this)">제주지사 연락처</button>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="마음껏 물어보세요!" />
      <button id="sendBtn">전송</button>
    </div>
  </div>
<script>
  const WORKER_URL = 'https://gemini-proxy.jubung31.workers.dev';
  const chat = document.getElementById('chat');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const loading = document.getElementById('loading');

  const SYSTEM_PROMPT = `한국산업인력공단 제주지사 일학습병행 상담 챗봇입니다.

[CRITICAL: 답변 형식 - 반드시 준수]
1. 최대 3문장 이내로 답변합니다.
2. 항목이 필요하면 2개만 작성합니다.
3. 키워드 중심으로 간결하게 답변합니다.


[기업 지원/혜택 안내 - 사용자가 기업 지원, 혜택, 비용, 지원금, 보조금, 인센티브 등에 대해 질문할 경우 아래 내용 전체를 바탕으로 통합하여 답변합니다]
일학습병행에 참여하는 기업은 크게 두 가지 혜택을 받습니다: ①비용지원(금전적 혜택)과 ②비금전적 혜택(가점·우대)입니다.

① 비용지원(훈련비)
훈련기간, 훈련인원, 훈련방식에 따라 지원 비용에 차이가 생깁니다.
자세한 비용은 수당계산기(https://kjbbung.github.io/calculator-worklearning/)로 확인하세요.

② 비금전적 혜택 (기관별 가점·우대)
▶ 병무청 - 산업기능요원 지정 인원 배정, 병역지정업체 선정평가 가점, 청년친화 강소기업 선정 시 가점
▶ 조달청 - 품질보증조달물자 지정 심사 시 가점
▶ 고용노동부 - Best HRD 선정평가 가점, 청년친화 강소기업 선정평가 우대
▶ 교육부 - 산학일체형 도제학교(현장실습) 참여 우대
▶ 안전보건공단 - 청년층 산업재해 예방 지원 대상 선정 시 가점
▶ (사)한국산업기술진흥협회·기업협회 등 - 인력·R&D 관련 사업 공모 시 우선지원 또는 우대

[동의어 처리 - 아래 단어들은 모두 동일한 주제로 처리합니다]
- "비용", "훈련비", "비용지원", "지원금", "보조금", "얼마" → 기업 지원/혜택 안내 참고
- "혜택", "인센티브", "장점", "좋은 점", "이점", "가점", "우대" → 기업 지원/혜택 안내 참고
- "지원", "지원내용", "도움" → 기업 지원/혜택 안내 참고`;

  let conversationHistory = [];

  function linkify(text) {
    const urlRegex = /(https?:\/\/[^\s)]+)/g;
    const parts = text.split(urlRegex);
    const span = document.createElement('span');
    parts.forEach((part, i) => {
      if (urlRegex.test(part)) {
        const a = document.createElement('a');
        a.href = part;
        a.textContent = part;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        span.appendChild(a);
      } else {
        span.appendChild(document.createTextNode(part));
      }
      urlRegex.lastIndex = 0;
    });
    return span;
  }

  function addMessage(text, role) {
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${role}`;
    const bubble = document.createElement('div');
    bubble.className = `bubble ${role === 'error' ? 'error' : role}`;
    bubble.appendChild(linkify(text));
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function askFaq(btn) {
    userInput.value = btn.textContent;
    sendMessage();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    userInput.value = '';
    sendBtn.disabled = true;
    loading.style.display = 'block';
    conversationHistory.push({ role: 'user', parts: [{ text }] });
    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ systemInstruction: SYSTEM_PROMPT, contents: conversationHistory })
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || `오류 코드: ${response.status}`);
      }
      const botText = data.candidates?.[0]?.content?.parts?.[0]?.text || '응답을 받을 수 없습니다.';
      conversationHistory.push({ role: 'model', parts: [{ text: botText }] });
      addMessage(botText, 'bot');
    } catch (err) {
      // 오류 메시지를 한국어로 표시하고, 재시도 안내 추가
      const isHighDemandError = err.message && err.message.includes('high demand');
      if (isHighDemandError) {
        addMessage('일시적으로 접속이 많아 답변이 지연되고 있습니다. 잠시 후 다시 시도해주세요.', 'error');
      } else {
        addMessage('오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'error');
      }    } finally {
      sendBtn.disabled = false;
      loading.style.display = 'none';
      userInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  addMessage('안녕하세요! 일학습병행 전문 상담 챗봇입니다. 일학습병행제도에 관한 궁금한 사항을 편하게 질문해 주세요.\n아래 자주 묻는 질문 버튼을 눌러 바로 확인하실 수도 있습니다.', 'bot');
</script>
</body>
</html>
